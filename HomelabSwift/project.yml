name: Homelab
options:
  bundleIdPrefix: com.homelab
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  configs:
    Release:
      SWIFT_COMPILATION_MODE: incremental

# Open-source VT100/xterm emulator for Arcane interactive container shell.
# Pin pre-Metal (≤1.11.x): Xcode beta CI may lack MetalToolchain; CoreText renderer is enough for mobile.
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2

targets:
  Homelab:
    type: application
    platform: iOS
    sources:
      - path: Homelab
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SwiftTerm
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Homelab/Info.plist
        CODE_SIGN_ENTITLEMENTS: Homelab/Homelab.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - AppIconDark
          - AppIconClearLight
          - AppIconClearDark
          - AppIconTintedLight
          - AppIconTintedDark
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HomelabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HomelabTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Homelab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homelab.homelab.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Homelab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Homelab"
        BUNDLE_LOADER: "$(TEST_HOST)"
