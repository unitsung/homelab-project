name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check iOS version metadata
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib
          import sys

          plist_path = pathlib.Path("HomelabSwift/Homelab/Info.plist")
          with plist_path.open("rb") as fp:
              info = plistlib.load(fp)

          ios_version = str(info.get("CFBundleShortVersionString", "")).strip()
          ios_build = str(info.get("CFBundleVersion", "")).strip()
          if not ios_version or not ios_build:
              print("Missing CFBundleShortVersionString or CFBundleVersion in Info.plist", file=sys.stderr)
              sys.exit(1)

          print(f"iOS version: {ios_version} ({ios_build})")
          PY

      - name: Ensure release binaries are not tracked
        run: |
          tracked="$(git ls-files '*.ipa' '*.apk' '*.aab')"
          if [ -n "$tracked" ]; then
            echo "Release binaries must not be committed:"
            echo "$tracked"
            exit 1
          fi

  ios-compile:
    name: iOS compile (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: HomelabSwift
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create CI signing config
        run: |
          mkdir -p Config
          printf 'DEVELOPMENT_TEAM =\nPRODUCT_BUNDLE_IDENTIFIER = com.unitsung.myhomelab\n' > Config/Signing.xcconfig

      - name: List schemes
        run: xcodebuild -list -project Homelab.xcodeproj

      - name: Compile iOS app without signing
        run: |
          xcodebuild build \
            -project Homelab.xcodeproj \
            -scheme Homelab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/homelab-ios-dd" \
            CODE_SIGNING_ALLOWED=NO
