# Optional signed IPA build for AltStore / SideStore distribution.
#
# This does NOT replace local Xcode archive. Enable only after GitHub Secrets
# below are set. Until then, keep using a manually signed Homelab.ipa on release.
#
# Required repository secrets:
#   IOS_CERTIFICATE_P12_BASE64   — base64 of the .p12 distribution/development cert
#   IOS_CERTIFICATE_PASSWORD     — password for that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 — base64 of the .mobileprovision
#   IOS_TEAM_ID                  — 10-char Apple Team ID
#   IOS_BUNDLE_ID                — e.g. com.unitsung.myhomelab
#
# Export profile type must match the cert + provisioning profile
# (development / ad-hoc / app-store). AltStore/SideStore typically need
# ad-hoc or development signing with matching device UDIDs.
#
# Encode secrets locally (do not commit the files):
#   base64 -i Certificates.p12 | pbcopy
#   base64 -i Homelab.mobileprovision | pbcopy

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "exportOptions.plist method"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - development
          - app-store

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Archive and export IPA (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: HomelabSwift
    steps:
      - uses: actions/checkout@v5

      - name: Require signing secrets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          missing=0
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_BUNDLE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the secrets listed in the workflow header, then re-run."
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PP_UUID=$(plutil -extract UUID raw "$PP_PLIST")
          PP_NAME=$(plutil -extract Name raw "$PP_PLIST")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$PP_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PP_NAME ($PP_UUID)"

      - name: Write signing xcconfig
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          mkdir -p Config
          if [ "${{ inputs.export_method }}" = "development" ]; then
            IDENTITY="Apple Development"
          else
            IDENTITY="Apple Distribution"
          fi
          cat > Config/Signing.xcconfig <<EOF
DEVELOPMENT_TEAM = ${IOS_TEAM_ID}
PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID}
CODE_SIGN_STYLE = Manual
CODE_SIGN_IDENTITY = ${IDENTITY}
PROVISIONING_PROFILE_SPECIFIER = ${PROVISIONING_PROFILE_NAME}
EOF
          cat Config/Signing.xcconfig

      - name: Archive
        run: |
          xcodebuild archive \
            -project Homelab.xcodeproj \
            -scheme Homelab \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Homelab.xcarchive" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/homelab-ios-dd"

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          METHOD="${{ inputs.export_method }}"
          cat > "$EXPORT_PLIST" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>${METHOD}</string>
  <key>teamID</key>
  <string>${IOS_TEAM_ID}</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>${IOS_BUNDLE_ID}</key>
    <string>${PROVISIONING_PROFILE_UUID}</string>
  </dict>
  <key>compileBitcode</key>
  <false/>
  <key>stripSwiftSymbols</key>
  <true/>
</dict>
</plist>
EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Homelab.xcarchive" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"
          # Normalize artifact name
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          cp "$IPA" "$RUNNER_TEMP/Homelab.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homelab.ipa
          path: ${{ runner.temp }}/Homelab.ipa
          if-no-files-found: error
          retention-days: 14
